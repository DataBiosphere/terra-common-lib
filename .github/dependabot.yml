version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    open-pull-requests-limit: 10
    groups:
      minor-patch-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    schedule:
      interval: cron
      cronjob: "0 0 1,15 * *"
    target-branch: "develop"
    labels:
      - "dependency"
      - "gradle"
    commit-message:
      prefix: "[DT-400-gradle]"
